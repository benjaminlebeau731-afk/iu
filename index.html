<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Webhook Sender Pro</title>
    <style>
        :root {
            --bg-color: #1e1f22;
            --card-color: #2b2d31;
            --input-bg: #1e1f22;
            --text-main: #dbdee1;
            --text-muted: #949ba4;
            --blurple: #5865F2;
            --blurple-hover: #4752C4;
            --red: #da373c;
            --red-hover: #a12828;
            --border-radius: 8px;
        }

        body {
            font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-color);
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 24px;
            text-align: center;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        input[type="password"],
        input[type="number"],
        textarea {
            width: 100%;
            background-color: var(--input-bg);
            border: none;
            color: var(--text-main);
            padding: 12px;
            border-radius: 4px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            transition: box-shadow 0.2s ease;
        }

        input:focus, textarea:focus {
            box-shadow: 0 0 0 2px var(--blurple);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }

        #startBtn {
            background-color: var(--blurple);
        }

        #startBtn:hover:not(:disabled) {
            background-color: var(--blurple-hover);
        }

        #stopBtn {
            background-color: var(--red);
        }

        #stopBtn:hover:not(:disabled) {
            background-color: var(--red-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .console {
            background-color: #111214;
            border-radius: var(--border-radius);
            padding: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            height: 120px;
            overflow-y: auto;
            color: #43b581;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .log-entry {
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .log-time {
            color: var(--text-muted);
            margin-right: 8px;
        }

        .log-error { color: #f04747; }
        .log-warn { color: #faa61a; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Webhook Automator</h2>
        
        <div class="form-group">
            <label for="webhook-url">Paste Webhook URL *</label>
            <input type="password" id="webhook-url" placeholder="https://discord.com/api/webhooks/..." autocomplete="off">
        </div>
        
        <div class="form-group">
            <label for="message-text">Message Content</label>
            <textarea id="message-text">Automated message from Webhook Automator! 🚀</textarea>
        </div>
        
        <div class="form-group">
            <label for="interval-sec">Send Interval (Seconds)</label>
            <input type="number" id="interval-sec" value="60" min="2">
        </div>

        <div class="button-group">
            <button id="startBtn">Start Sending</button>
            <button id="stopBtn" disabled>Stop</button>
        </div>

        <label>System Terminal</label>
        <div class="console" id="log">
            <div class="log-entry"><span class="log-time">[System]</span> Ready for input.</div>
        </div>
    </div>

    <script>
        let timer = null;

        function addLog(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type === 'error' ? 'log-error' : type === 'warn' ? 'log-warn' : ''}`;
            
            const time = new Date().toLocaleTimeString([], { hour12: false });
            entry.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
            
            logDiv.appendChild(entry);
            // Auto-scroll to bottom
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function sendMessage() {
            const url = document.getElementById('webhook-url').value.trim();
            const content = document.getElementById('message-text').value;

            if (!url) {
                addLog("Error: Webhook URL is required.", "error");
                stopSequence();
                return;
            }

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });

                if (response.ok) {
                    addLog("Payload delivered successfully.");
                } else if (response.status === 429) {
                    addLog("Rate limited (429). Halting to prevent IP ban.", "error");
                    stopSequence();
                } else if (response.status === 401 || response.status === 404) {
                    addLog("Invalid Webhook URL. Please check your link.", "error");
                    stopSequence();
                } else {
                    addLog(`Delivery failed. HTTP Status: ${response.status}`, "warn");
                }
            } catch (err) {
                addLog("Network connection failed. Check your internet.", "error");
                stopSequence();
            }
        }

        function stopSequence() {
            clearInterval(timer);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('webhook-url').disabled = false;
            addLog("Automation sequence stopped.", "warn");
        }

        document.getElementById('startBtn').onclick = () => {
            const url = document.getElementById('webhook-url').value.trim();
            const interval = parseInt(document.getElementById('interval-sec').value, 10) * 1000;
            
            if (!url) {
                addLog("Please paste a Webhook URL first.", "error");
                document.getElementById('webhook-url').focus();
                return;
            }

            if (interval < 2000) {
                addLog("Interval too fast. Set to at least 2 seconds.", "warn");
                return;
            }

            // Lock the input and start button while running
            document.getElementById('webhook-url').disabled = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            addLog(`Sequence initialized. Interval: ${interval/1000}s`);
            
            sendMessage(); // Fire first message immediately
            timer = setInterval(sendMessage, interval);
        };

        document.getElementById('stopBtn').onclick = stopSequence;
    </script>
</body>
</html>
